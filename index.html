<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Пятнашки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">МИНИ-ИГРА</div>
      <h1>Пятнашки</h1>
      <p class="subtitle">Собери числа по порядку</p>
    </header>

    <section class="stats" aria-label="Статистика игры">
      <div class="stat"><span>ХОДЫ</span><strong id="moves">0</strong></div>
      <div class="stat"><span>ВРЕМЯ</span><strong id="time">0:00</strong></div>
      <div class="stat"><span>РЕКОРД</span><strong id="best">—</strong></div>
    </section>

    <section class="game-card">
      <div id="board" class="board" aria-label="Игровое поле 4 на 4"></div>
      <div id="message" class="message" role="status">Нажми «Новая игра», чтобы начать</div>
      <button id="newGame" class="new-game">↻ Новая игра</button>
    </section>
    <footer>Перемещай плитки в пустую клетку</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
